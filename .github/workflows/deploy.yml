name: Build Android APK (Argon Mobile Agent)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/**"
      - "app/src/main/assets/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compile Native Android Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: cp app/build/outputs/apk/debug/app-debug.apk Argon-GitHub-Agent.apk

      - name: Upload Installable APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Argon-GitHub-Agent-APK
          path: Argon-GitHub-Agent.apk

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2-apk
          overwrite_files: true
          name: "Argon 4.0 Android App (Installable APK)"
          body: "Tap Argon-GitHub-Agent.apk below to download and install the native Android app on your phone."
          files: Argon-GitHub-Agent.apk
